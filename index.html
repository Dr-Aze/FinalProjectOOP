<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Attendance Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
        .status-card { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <h2>Student Attendance Scanner</h2>
    <div id="reader"></div>
    <div id="status" class="status-card"></div>

    <script>
        const statusDiv = document.getElementById('status');

        function playBeep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.value = 800;
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        }

        function onScanSuccess(decodedText, decodedResult) {
            // 1. Play audio feedback & vibrate phone
            playBeep();
            if (navigator.vibrate) navigator.vibrate(200);

            // 2. Display scanned Student ID
            statusDiv.className = "status-card success";
            statusDiv.style.display = "block";
            statusDiv.innerText = "✓ Scanned ID: " + decodedText + " (Next scan in 2s...)";

            // 3. Pause scanning temporarily
            html5QrcodeScanner.pause(true);

            // 4. Send Student ID to backend/Google Sheet here (e.g. via fetch)

            // 5. Automatically resume scanning after 2 seconds
            setTimeout(() => {
                statusDiv.style.display = "none";
                html5QrcodeScanner.resume();
            }, 2000);
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
