<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Camera Upload</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        form { border: 2px dashed #ccc; padding: 30px; border-radius: 8px; display: inline-block; }
        input[type="file"] { margin-bottom: 15px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Scan QR Code</h2>
    
    <form action="decode.php" method="POST" enctype="multipart/form-data">
        <p>Tap below to take a photo of the QR code:</p>
        <input type="file" name="qr_image" accept="image/*" capture="environment" required>
        <br>
        <button type="submit">Upload & Decode</button>
    </form>
</body>
</html>
