<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    <!-- HTML5 QR Code Reader Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2rem; color: #28a745; }
    </style>
</head>
<body>

    <h2>Student ID Scanner</h2>
    <div id="reader"></div>
    <div id="result"></div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // decodedText contains the scanned Student ID number
            document.getElementById('result').innerText = "Scanned ID: " + decodedText;

            // Optional: Send the scanned ID to a Google Sheet, Firebase, or external API
            // fetch('YOUR_API_ENDPOINT', { method: 'POST', body: JSON.stringify({ student_id: decodedText }) });
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
